<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>ขนมครกสิงคโปร์ — สั่งผ่าน LINE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --teal:#146B6E; --coral:#E85D4C; --mustard:#E3A335;
    --cream:#FBF3E7; --cream-deep:#F3E6D3; --plum:#3A2233; --leaf:#527A54;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);font-family:'Sarabun',sans-serif;color:var(--plum);}
  .mitr{font-family:'Mitr',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,textarea{font-family:inherit;}
  .card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 20px -12px rgba(58,34,51,.25);}
  .pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid #D9C9AE;background:#fff;color:var(--plum);}
  .pill.active{background:var(--coral);border-color:var(--coral);color:#fff;}
  .btn-primary{background:var(--coral);color:#fff;border-radius:999px;padding:12px 20px;font-weight:600;}
  .btn-primary:disabled{opacity:.4;}
  .btn-teal{background:var(--teal);color:#fff;border-radius:999px;padding:10px 16px;font-weight:600;}
  .stepper{display:flex;align-items:center;border:1px solid #D9C9AE;border-radius:999px;overflow:hidden;}
  .stepper button{width:32px;height:32px;color:var(--teal);}
  .header{background:var(--teal);padding:20px 16px 26px;color:#fff;}
  .thumb{width:64px;height:64px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,#E3A33533,#E85D4C22);border:2px dashed var(--cream-deep);object-fit:cover;}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;}
  .drawer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;max-height:85vh;display:flex;flex-direction:column;z-index:31;}
  input[type=text],input[type=password],input[type=number],textarea{width:100%;padding:8px 12px;border-radius:12px;border:1px solid #D9C9AE;font-size:14px;}
  .sticky-bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 16px 20px;background:linear-gradient(to top, var(--cream), var(--cream) 60%, transparent);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel-source" id="app-source">
const { useState, useEffect, useCallback } = React;

/* ====== ตั้งค่าก่อนใช้งานจริง ====== */
const API_BASE = ""; // เว้นว่างไว้ได้เลย เพราะหน้าเว็บนี้กับเซิร์ฟเวอร์อยู่โดเมนเดียวกัน (Glitch)
const LIFF_ID = "2010953976-QdHdT43h"; // จาก LINE Developers Console > LIFF — ต้องตั้งหลังได้ URL ของ Glitch แล้ว

function baht(n){ return Number(n).toLocaleString("th-TH"); }

function useLiffProfile(){
  const [profile, setProfile] = useState(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    if (!window.liff || LIFF_ID === "YOUR_LIFF_ID") { setReady(true); return; }
    liff.init({ liffId: LIFF_ID }).then(async () => {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const p = await liff.getProfile();
      setProfile(p);
      setReady(true);
    }).catch(() => setReady(true));
  }, []);
  return { profile, ready };
}

function Pill({active,onClick,children}){
  return <button className={"pill" + (active?" active":"")} onClick={onClick}>{children}</button>;
}
function Stepper({value,onChange,min=0}){
  return (
    <div className="stepper">
      <button onClick={()=>onChange(Math.max(min,value-1))}>−</button>
      <span className="mono" style={{width:28,textAlign:"center",fontWeight:600}}>{value}</span>
      <button onClick={()=>onChange(value+1)}>+</button>
    </div>
  );
}
function Thumb({product}){
  if (product.image) return <img className="thumb" src={product.image} alt={product.name}/>;
  return <div className="thumb">{product.emoji || "🍽️"}</div>;
}

function MascotCard({userId}){
  const [data,setData] = useState(null);
  const [redeeming,setRedeeming] = useState(false);
  const [bathing,setBathing] = useState(false);
  const [patting,setPatting] = useState(false);
  const [flash,setFlash] = useState(null); // "fed" | "clean" | null
  const [foodPos,setFoodPos] = useState(null); // {x,y} relative to stageRef, or null if not spawned
  const [dragging,setDragging] = useState(false);
  const [mouthOpen,setMouthOpen] = useState(false);
  const stageRef = React.useRef(null);
  const foodPosRef = React.useRef(null);
  useEffect(()=>{ foodPosRef.current = foodPos; },[foodPos]);

  const MOUTH = {x:100, y:80};
  const BOX = {x:100, y:186};
  const CATCH_R = 34;

  const load = () => {
    if (!userId) return;
    fetch(`${API_BASE}/api/mascot/${userId}`, {cache:"no-store"}).then(r=>r.json()).then(setData).catch(()=>{});
  };
  useEffect(load, [userId]);

  const redeem = async () => {
    if (redeeming || !data?.canRedeem) return;
    setRedeeming(true);
    try {
      await fetch(`${API_BASE}/api/mascot/${userId}/redeem`, { method:"POST" });
      load();
    } finally {
      setRedeeming(false);
    }
  };

  const bathMascot = async () => {
    if (bathing || !data?.isDirty) return;
    setBathing(true);
    try {
      await fetch(`${API_BASE}/api/mascot/${userId}/bath`, { method:"POST" });
      setTimeout(async () => {
        setFlash("clean");
        await new Promise(r=>setTimeout(r,600));
        setFlash(null);
        load();
        setBathing(false);
      }, 1100);
    } catch(e) {
      setBathing(false);
    }
  };

  const patMascot = () => {
    if (patting) return;
    setPatting(true);
    setTimeout(()=>setPatting(false), 900);
  };

  const spawnFood = () => {
    if (!data?.canFeed || foodPos) return;
    setFoodPos({...BOX});
  };

  const getRelPos = (e) => {
    const rect = stageRef.current.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };

  const onFoodPointerDown = (e) => {
    e.preventDefault();
    setDragging(true);
  };

  useEffect(() => {
    if (!dragging) return;
    const move = (e) => {
      const pos = getRelPos(e);
      setFoodPos(pos);
      const dist = Math.hypot(pos.x-MOUTH.x, pos.y-MOUTH.y);
      setMouthOpen(dist < CATCH_R);
    };
    const up = async (e) => {
      setDragging(false);
      const pos = foodPosRef.current;
      const dist = pos ? Math.hypot(pos.x-MOUTH.x, pos.y-MOUTH.y) : 999;
      if (dist < CATCH_R) {
        setMouthOpen(false);
        setFoodPos(null);
        setFlash("fed");
        await fetch(`${API_BASE}/api/mascot/${userId}/feed`, { method:"POST" });
        setTimeout(()=>{ setFlash(null); load(); }, 500);
      } else {
        setMouthOpen(false);
        setFoodPos({...BOX});
      }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    return () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
  }, [dragging]);

  if (!data) return null;
  const progress = data.nextThreshold
    ? Math.min(100, ((data.foodGiven-data.stageStart)/(data.nextThreshold-data.stageStart))*100)
    : 100;

  return (
    <div className="card" style={{marginBottom:12,textAlign:"center"}}>
      <div ref={stageRef} style={{position:"relative",width:200,height:225,margin:"0 auto",touchAction: dragging ? "none" : "auto"}}>
        <div style={{position:"absolute",top:0,left:35,width:130,height:130}}>
          <div style={{
            width:"100%",height:"100%",
            animation: bathing ? "none" : "mascot-bob 2.4s ease-in-out infinite",
          }}>
            <img
              src={data.image}
              alt={data.stageName}
              style={{
                width:"100%", height:"100%", objectFit:"contain",
                transform: flash==="fed" ? "scale(1.1)" : patting ? "scale(1.06) rotate(-3deg)" : mouthOpen ? "scale(1.04)" : "scale(1)",
                transition:"transform .2s cubic-bezier(.34,1.56,.64,1)",
                filter: bathing ? "brightness(1.05)" : "none",
              }}
            />
          </div>

          {/* open-mouth illusion when food is close */}
          {mouthOpen && (
            <div style={{
              position:"absolute", top:66, left:"50%", transform:"translateX(-50%)",
              width:22, height:14, borderRadius:"50% 50% 60% 60%",
              background:"rgba(58,34,51,.75)",
              animation:"mouth-pop .18s ease-out",
            }}/>
          )}

          {/* dirt smudges */}
          {data.isDirty && !bathing && (
            <React.Fragment>
              <div style={{position:"absolute",top:"32%",left:"22%",width:16,height:12,borderRadius:"50%",background:"rgba(140,110,72,.55)",transform:"rotate(-15deg)"}}/>
              <div style={{position:"absolute",top:"55%",left:"66%",width:20,height:14,borderRadius:"50%",background:"rgba(140,110,72,.5)",transform:"rotate(10deg)"}}/>
              <div style={{position:"absolute",top:"68%",left:"38%",width:14,height:10,borderRadius:"50%",background:"rgba(140,110,72,.5)"}}/>
            </React.Fragment>
          )}

          {/* bath bubbles */}
          {bathing && (
            <div style={{position:"absolute",inset:-10,pointerEvents:"none"}}>
              {[...Array(9)].map((_,i)=>(
                <div key={i} style={{
                  position:"absolute", left:`${10+((i*37)%85)}%`, bottom:0,
                  width:8+((i%3)*5), height:8+((i%3)*5), borderRadius:"50%",
                  background:"rgba(255,255,255,.65)", border:"1px solid rgba(255,255,255,.9)",
                  animation:`bubble-rise ${0.9+((i%4)*0.15)}s ease-in ${i*0.08}s forwards`,
                }}/>
              ))}
            </div>
          )}

          {/* pat hearts */}
          {patting && (
            <div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
              {[...Array(4)].map((_,i)=>(
                <div key={i} style={{
                  position:"absolute", top:"20%", left:`${30+i*15}%`, fontSize:16,
                  animation:`heart-rise .9s ease-out ${i*0.1}s forwards`, opacity:0,
                }}>💚</div>
              ))}
            </div>
          )}
        </div>

        {/* food box */}
        <div
          onClick={spawnFood}
          style={{
            position:"absolute", top:168, left:"50%", transform:"translateX(-50%)",
            width:44, height:36, borderRadius:8,
            background: data.canFeed ? "var(--mustard)" : "#D9C9AE",
            border:"2px solid var(--plum)", display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:18, cursor: data.canFeed && !foodPos ? "pointer" : "default",
            boxShadow:"0 3px 6px rgba(0,0,0,.2)",
          }}
        >
          🎁
          {data.foodInventory>0 && (
            <span className="mono" style={{position:"absolute",bottom:-8,right:-8,background:"var(--coral)",color:"#fff",fontSize:10,fontWeight:700,borderRadius:999,padding:"1px 6px"}}>{data.foodInventory}</span>
          )}
        </div>

        {/* draggable food token */}
        {foodPos && (
          <div
            onPointerDown={onFoodPointerDown}
            style={{
              position:"absolute", top:foodPos.y-16, left:foodPos.x-16,
              width:32, height:32, borderRadius:"50%",
              background:"#fff", border:"2px solid var(--plum)",
              display:"flex",alignItems:"center",justifyContent:"center", fontSize:18,
              cursor:"grab", touchAction:"none", zIndex:10,
              boxShadow: dragging ? "0 6px 10px rgba(0,0,0,.3)" : "0 2px 4px rgba(0,0,0,.2)",
              transition: dragging ? "none" : "top .25s ease, left .25s ease",
            }}
          >🍡</div>
        )}
      </div>

      <p className="mitr" style={{margin:"2px 0 2px",fontSize:15,fontWeight:700}}>
        {data.stageName}{data.isDirty && !bathing ? " · ตัวเลอะจัง 🫧" : ""}
      </p>
      <p style={{fontSize:12,color:"#7A6A5C",margin:"0 0 4px"}}>
        {data.nextThreshold ? `อาหารแล้ว ${data.foodGiven}/${data.nextThreshold} ชิ้น จะโตขึ้นอีกขั้น!` : "โตเต็มขั้นแล้ว ขอบคุณที่อุดหนุนกันมาตลอดนะครับ 🙏"}
      </p>
      <p style={{fontSize:11,color:"#9C8A7A",margin:"0 0 12px"}}>
        {data.canFeed ? "แตะกล่องของขวัญ 🎁 แล้วลากอาหารไปป้อนปากได้เลย" : "ยังไม่มีอาหารในคลัง แลกแต้มเป็นอาหารก่อนนะครับ"}
      </p>
      <div style={{height:8,background:"var(--cream-deep)",borderRadius:999,overflow:"hidden",margin:"0 0 14px"}}>
        <div style={{height:"100%",width:`${progress}%`,background:"var(--leaf)",borderRadius:999,transition:"width .4s"}}/>
      </div>

      <div className="card" style={{background:"var(--cream)",boxShadow:"none",padding:12,marginBottom:12}}>
        <p style={{fontSize:13,margin:0}}>แต้มของคุณ: <b className="mono" style={{color:"var(--coral)"}}>{data.availablePoints}</b> แต้ม</p>
        <p style={{fontSize:11,color:"#9C8A7A",margin:"2px 0 0"}}>ทุก 100฿ ในบิลที่ทำเสร็จแล้วได้ 1 แต้ม · ใช้ {data.pointsPerFood} แต้มแลกอาหาร 1 ชิ้น</p>
        <p style={{fontSize:13,margin:"8px 0 0"}}>อาหารในคลัง: <b className="mono" style={{color:"var(--leaf)"}}>{data.foodInventory}</b> ชิ้น</p>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {data.nextThreshold && (
          <button className="btn-teal" style={{background: data.canRedeem ? "var(--teal)" : "#C9BBA5"}} disabled={redeeming || !data.canRedeem} onClick={redeem}>
            💰 แลกแต้มเป็นอาหาร (ใช้ {data.pointsPerFood} แต้ม)
          </button>
        )}
        {data.isDirty && (
          <button className="btn-teal" style={{background: flash==="clean" ? "var(--leaf)" : "#3D7FBF"}} disabled={bathing} onClick={bathMascot}>
            {bathing ? "กำลังอาบน้ำ... 🫧" : flash==="clean" ? "สะอาดแล้ว! ✨" : "🛁 อาบน้ำให้มาสคอต"}
          </button>
        )}
        <button className="pill" style={{width:"100%"}} disabled={patting} onClick={patMascot}>
          🤚 ลูบหัวมาสคอต
        </button>
      </div>

      <style>{`
        @keyframes mascot-bob { 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-6px) rotate(-2deg);} }
        @keyframes bubble-rise { 0%{ transform: translateY(0) scale(.6); opacity:0;} 15%{ opacity:1;} 100%{ transform: translateY(-140px) scale(1); opacity:0;} }
        @keyframes heart-rise { 0%{ transform: translateY(0) scale(.5); opacity:0;} 20%{ opacity:1;} 100%{ transform: translateY(-46px) scale(1.1); opacity:0;} }
        @keyframes mouth-pop { 0%{ transform: translateX(-50%) scale(.5); opacity:0;} 100%{ transform: translateX(-50%) scale(1); opacity:1;} }
      `}</style>
    </div>
  );
}

function MascotScreen({userId,onClose}){
  return (
    <div style={{position:"fixed",inset:0,background:"#fff",zIndex:35,display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:"1px solid #F3E6D3"}}>
        <h2 className="mitr" style={{margin:0,fontSize:16}}>มาสคอตของฉัน</h2>
        <button onClick={onClose}>✕</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>
        <MascotCard userId={userId}/>
      </div>
    </div>
  );
}

function ProductCard({product,onAdd}){
  const [variantId,setVariantId] = useState(product.variants[0]?.id);
  const [qty,setQty] = useState(1);
  const [flash,setFlash] = useState(false);
  const variant = product.variants.find(v=>v.id===variantId) || product.variants[0];
  const soldOut = !!product.soldOut;
  const add = () => {
    if (soldOut) return;
    onAdd(product, variant, qty);
    setQty(1); setFlash(true); setTimeout(()=>setFlash(false),500);
  };
  return (
    <div className="card" style={{marginBottom:12, opacity: soldOut ? 0.6 : 1}}>
      <div style={{display:"flex",gap:12}}>
        <Thumb product={product}/>
        <div style={{minWidth:0,flex:1}}>
          <h3 className="mitr" style={{margin:0,fontSize:15,fontWeight:600}}>{product.name}</h3>
          <p style={{margin:"2px 0 0",fontSize:12,color:"#7A6A5C"}}>{product.tagline}</p>
          {soldOut && <span style={{display:"inline-block",marginTop:6,fontSize:11,fontWeight:700,color:"#fff",background:"var(--coral)",padding:"2px 10px",borderRadius:999}}>สินค้าหมด</span>}
        </div>
      </div>
      {!soldOut && (
        <React.Fragment>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:12}}>
            {product.variants.map(v=>(
              <Pill key={v.id} active={v.id===variantId} onClick={()=>setVariantId(v.id)}>
                {v.label} · {baht(v.price)}฿
              </Pill>
            ))}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}>
            <Stepper value={qty} onChange={setQty} min={1}/>
            <button className="btn-teal" style={{background:flash?"#527A54":"#146B6E"}} onClick={add}>
              {flash ? "เพิ่มแล้ว ✓" : `ใส่ตะกร้า ${baht(variant.price*qty)}฿`}
            </button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function CartDrawer({open,onClose,cart,onQtyChange,onRemove,total,onCheckout}){
  if (!open) return null;
  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}/>
      <div className="drawer">
        <div style={{display:"flex",justifyContent:"space-between",padding:"16px 20px 8px"}}>
          <h2 className="mitr" style={{margin:0,fontSize:16}}>ตะกร้าของคุณ</h2>
          <button onClick={onClose}>✕</button>
        </div>
        <div style={{overflowY:"auto",padding:"0 20px",flex:1}}>
          {cart.length===0 ? (
            <p style={{textAlign:"center",color:"#9C8A7A",padding:"30px 0"}}>ยังไม่มีสินค้าในตะกร้า</p>
          ) : cart.map(item=>(
            <div key={item.key} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #F3E6D3"}}>
              <div style={{flex:1,minWidth:0}}>
                <p style={{margin:0,fontSize:14,fontWeight:500}}>{item.productName} — {item.variantLabel}</p>
                <p className="mono" style={{margin:"2px 0 0",fontSize:12,color:"var(--coral)"}}>{baht(item.price)}฿ / กล่อง</p>
              </div>
              <Stepper value={item.qty} onChange={(n)=>onQtyChange(item.key,n)} min={0}/>
              <button onClick={()=>onRemove(item.key)}>🗑</button>
            </div>
          ))}
        </div>
        <div style={{padding:"12px 20px 24px",borderTop:"1px solid #F3E6D3"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
            <span>ยอดรวม</span>
            <span className="mono" style={{fontWeight:700,fontSize:18}}>{baht(total)}฿</span>
          </div>
          <button className="btn-primary" style={{width:"100%"}} disabled={cart.length===0} onClick={onCheckout}>
            ไปหน้ายืนยันออเดอร์
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

function CheckoutScreen({cart,total,profile,onBack,onConfirm,submitting}){
  const [name,setName] = useState(profile?.displayName || "");
  const [fulfil,setFulfil] = useState("รับเอง");
  const [note,setNote] = useState("");
  const canSubmit = name.trim().length>0 && !submitting;
  return (
    <div style={{padding:"12px 16px 120px"}}>
      <button onClick={onBack} style={{color:"var(--teal)",fontSize:14,marginBottom:12}}>‹ กลับไปแก้ตะกร้า</button>
      <h2 className="mitr" style={{fontSize:18,marginTop:0}}>ยืนยันออเดอร์</h2>
      <div className="card" style={{marginBottom:12}}>
        {cart.map(item=>(
          <div key={item.key} style={{display:"flex",justifyContent:"space-between",fontSize:14,padding:"6px 0",borderBottom:"1px solid #F3E6D3"}}>
            <span>{item.productName} ({item.variantLabel}) × {item.qty}</span>
            <span className="mono">{baht(item.price*item.qty)}฿</span>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,paddingTop:8}}>
          <span>รวมทั้งหมด</span><span className="mono" style={{color:"var(--coral)"}}>{baht(total)}฿</span>
        </div>
      </div>
      <div className="card">
        <label style={{fontSize:12,color:"#7A6A5C"}}>ชื่อผู้สั่ง *</label>
        <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="เช่น คุณส้ม" style={{marginTop:4,marginBottom:12}}/>

function useGachaSound(){
  const ctxRef = React.useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === "suspended") ctxRef.current.resume();
    return ctxRef.current;
  };
  const beep = (freq,duration,type,startOffset,gainVal) => {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + startOffset;
    g.gain.setValueAtTime(gainVal, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.start(t); osc.stop(t + duration);
  };
  const playShake = () => { getCtx(); for (let i=0;i<13;i++) beep(280+Math.random()*160, 0.06, "square", i*0.2, 0.06); };
  const playDrop = () => {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = "sine";
    const t = ctx.currentTime;
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(110, t + 0.45);
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.45);
  };
  const playChime = () => { [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,0.35,"triangle",i*0.09,0.11)); };
  return { playShake, playDrop, playChime };
}

        body: JSON.stringify(next),
      });
      if (!res.ok) alert(`บันทึกไม่สำเร็จ (${res.status}) ลองใหม่อีกครั้ง`);
    } catch (e) {
      alert("บันทึกไม่สำเร็จ เช็คอินเทอร์เน็ตแล้วลองใหม่");
    }
  };
  const updateProduct = (pid, patch) => saveCatalog(catalog.map(p=>p.id===pid?{...p,...patch}:p));
  const updateVariant = (pid, vid, patch) => saveCatalog(catalog.map(p=> p.id!==pid ? p : {...p, variants:p.variants.map(v=>v.id===vid?{...v,...patch}:v)}));

  const notifySoldOut = async (productName) => {
    if (!window.confirm(`ส่งข้อความแจ้งลูกค้าทุกคนว่า "${productName}" หมดแล้วใช่ไหม?`)) return;
    try {
      await fetch(`${API_BASE}/api/notify-soldout`, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
        body: JSON.stringify({ productName }),
      });
      alert("ส่งข้อความแจ้งเตือนแล้วครับ");
    } catch (e) {
      alert("ส่งไม่สำเร็จ ลองใหม่อีกครั้ง");
    }
  };

  const savePaySettings = async (next) => {
    setPaySettings(next);
    await fetch(`${API_BASE}/api/settings`, {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
      body: JSON.stringify(next),
    });
  };

  const setOrderStatus = async (code, status) => {
    setOrders(orders.map(o=>o.code===code?{...o,status}:o));
    await fetch(`${API_BASE}/api/orders/${code}`, {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
      body: JSON.stringify({status}),
    });
  };

  const setLotteryUsed = async (code, used) => {
    setOrders(orders.map(o=>o.code===code?{...o,lotteryUsed:used}:o));
    await fetch(`${API_BASE}/api/orders/${code}`, {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
      body: JSON.stringify({lotteryUsed:used}),
    });
  };

  const grantMascotFood = async (userId, amount) => {
    if (!userId) return;
    await fetch(`${API_BASE}/api/mascot/${userId}/grant`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
      body: JSON.stringify({amount}),
    });
    alert(`แจกอาหารมาสคอต +${amount} ชิ้นให้ลูกค้าคนนี้แล้ว`);
  };

  if (!unlocked) {
    return (
      <div className="drawer-overlay" style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div className="card" style={{width:280}}>
          <h3 className="mitr" style={{marginTop:0}}>รหัสจัดการร้าน</h3>
          <input type="password" value={passcode} onChange={e=>setPasscode(e.target.value)} onKeyDown={e=>e.key==="Enter"&&unlock()} placeholder="กรอกรหัสผ่าน" style={{marginBottom:8,borderColor:error?"var(--coral)":"#D9C9AE"}}/>
          {error && <p style={{color:"var(--coral)",fontSize:12,margin:"0 0 8px"}}>{error}</p>}
          <div style={{display:"flex",gap:8}}>
            <button className="pill" style={{flex:1}} onClick={onClose}>ยกเลิก</button>
            <button className="btn-teal" style={{flex:1}} onClick={unlock}>เข้าสู่ระบบ</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{position:"fixed",inset:0,background:"#fff",zIndex:40,display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:"1px solid #F3E6D3"}}>
        <h2 className="mitr" style={{margin:0,fontSize:16}}>จัดการร้าน</h2>
        <button onClick={onClose}>✕</button>
      </div>
      <div style={{display:"flex",gap:8,padding:"12px 16px"}}>
        <Pill active={tab==="menu"} onClick={()=>setTab("menu")}>แก้ไขเมนู/ราคา/รูป</Pill>
        <Pill active={tab==="orders"} onClick={()=>setTab("orders")}>ออเดอร์ ({orders.length})</Pill>
        <Pill active={tab==="pay"} onClick={()=>setTab("pay")}>การชำระเงิน</Pill>
        <Pill active={tab==="faq"} onClick={()=>setTab("faq")}>คำถามที่พบบ่อย</Pill>
        <Pill active={tab==="lottery"} onClick={()=>setTab("lottery")}>รางวัลสุ่ม</Pill>
        <Pill active={tab==="mascot"} onClick={()=>setTab("mascot")}>มาสคอต</Pill>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0 16px 32px"}}>
        {tab==="menu" && catalog.map(p=>(
          <div key={p.id} className="card" style={{marginBottom:12}}>
            <div style={{display:"flex",gap:10,marginBottom:10}}>
              <Thumb product={p}/>
              <div style={{flex:1}}>
                <input type="text" value={p.name} onChange={e=>updateProduct(p.id,{name:e.target.value})} style={{marginBottom:6,fontWeight:600}}/>
                <input type="text" value={p.image} onChange={e=>updateProduct(p.id,{image:e.target.value})} placeholder="ลิงก์รูปภาพ (URL)" style={{fontSize:12}}/>
              </div>
            </div>
            {p.variants.map(v=>(
              <div key={v.id} style={{display:"flex",gap:8,marginBottom:6}}>
                <input type="text" value={v.label} onChange={e=>updateVariant(p.id,v.id,{label:e.target.value})} style={{flex:1}}/>
                <input type="number" value={v.price} onChange={e=>updateVariant(p.id,v.id,{price:Number(e.target.value)||0})} style={{width:80,textAlign:"right"}}/>
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button
                className="pill"
                style={p.soldOut ? {background:"var(--coral)",borderColor:"var(--coral)",color:"#fff",flex:1} : {flex:1}}
                onClick={()=>updateProduct(p.id,{soldOut: !p.soldOut})}
              >
                {p.soldOut ? "✓ ทำเครื่องหมายว่าหมดแล้ว" : "ทำเครื่องหมายว่าหมด"}
              </button>
              <button className="btn-teal" onClick={()=>notifySoldOut(p.name)}>📢 แจ้งลูกค้า</button>
            </div>
          </div>
        ))}
        {tab==="pay" && (
          <div className="card">
            <label style={{fontSize:12,color:"#7A6A5C"}}>ลิงก์รูป QR</label>
            <input type="text" value={paySettings.qrImage} onChange={e=>savePaySettings({...paySettings,qrImage:e.target.value})} style={{marginBottom:12}}/>
            <label style={{fontSize:12,color:"#7A6A5C"}}>ชื่อบัญชี/พร้อมเพย์</label>
            <input type="text" value={paySettings.accountName} onChange={e=>savePaySettings({...paySettings,accountName:e.target.value})}/>
            {paySettings.qrImage && <img src={paySettings.qrImage} alt="QR" style={{width:160,marginTop:12}}/>}
          </div>
        )}
        {tab==="mascot" && (
          <div className="card">
            <label style={{fontSize:12,color:"#7A6A5C"}}>แต้มที่ใช้แลกอาหาร 1 ชิ้น</label>
            <input type="number" min="1" value={paySettings.pointsPerFood||1} onChange={e=>{
              const next = {...paySettings, pointsPerFood: Math.max(1, Number(e.target.value)||1)};
              savePaySettings(next);
            }} style={{marginTop:6,marginBottom:10}}/>
            <p style={{fontSize:12,color:"#7A6A5C",margin:0}}>
              ลูกค้าได้ 1 แต้มทุกๆ 100฿ ในบิลที่แอดมินกดสถานะ "เสร็จแล้ว" แล้วเท่านั้น (ตรวจสลิปก่อนกดเสมอ) ใช้ <b>{paySettings.pointsPerFood||1}</b> แต้ม แลกอาหารมาสคอตได้ 1 ชิ้น
            </p>
            <p style={{fontSize:11,color:"#9C8A7A",marginTop:8}}>
              ด่านการเติบโต (คงที่ ไม่ต้องตั้ง): ร่าง 1→2 ใช้ 5 ชิ้น · 2→3 ใช้ 5 ชิ้น · 3→4 ใช้ 10 ชิ้น · 4→5 ใช้ 20 ชิ้น
            </p>
          </div>
        )}
        {tab==="lottery" && (
          <div>
            <p style={{fontSize:12,color:"#7A6A5C",marginBottom:10}}>
              ตั้ง % โอกาสได้รับแต่ละรางวัล — รวมกันไม่จำเป็นต้องพอดี 100 ระบบจะคำนวณสัดส่วนให้เองอัตโนมัติ (ตอนนี้รวม {(paySettings.lottery||[]).reduce((s,it)=>s+(Number(it.weight)||0),0)}%)
            </p>
            {(paySettings.lottery||[]).map((it,i)=>(
              <div key={i} className="card" style={{marginBottom:10,display:"flex",gap:8,alignItems:"center"}}>
                <input type="text" value={it.label} placeholder="ข้อความรางวัล" onChange={e=>{
                  const next = {...paySettings, lottery: paySettings.lottery.map((x,xi)=> xi===i ? {...x, label:e.target.value} : x)};
                  savePaySettings(next);
                }} style={{flex:1}}/>
                <input type="number" value={it.weight} onChange={e=>{
                  const next = {...paySettings, lottery: paySettings.lottery.map((x,xi)=> xi===i ? {...x, weight:Number(e.target.value)||0} : x)};
                  savePaySettings(next);
                }} style={{width:70,textAlign:"right"}}/>
                <span style={{fontSize:13,color:"#7A6A5C"}}>%</span>
                <button onClick={()=>{
                  const next = {...paySettings, lottery: paySettings.lottery.filter((_,xi)=>xi!==i)};
                  savePaySettings(next);
                }}>🗑</button>
              </div>
            ))}
            <button className="btn-teal" style={{width:"100%"}} onClick={()=>{
              const next = {...paySettings, lottery: [...(paySettings.lottery||[]), {label:"", weight:10}]};
              savePaySettings(next);
            }}>+ เพิ่มรางวัลใหม่</button>
          </div>
        )}
        {tab==="faq" && (
          <div>
            {(paySettings.faqs||[]).map((f,i)=>(
              <div key={i} className="card" style={{marginBottom:12}}>
                <label style={{fontSize:12,color:"#7A6A5C"}}>คีย์เวิร์ด (คั่นด้วยจุลภาค)</label>
                <input type="text" value={(f.keywords||[]).join(", ")} onChange={e=>{
                  const next = {...paySettings, faqs: paySettings.faqs.map((x,xi)=> xi===i ? {...x, keywords: e.target.value.split(",").map(s=>s.trim()).filter(Boolean)} : x)};
                  savePaySettings(next);
                }} style={{marginBottom:8}}/>
                <label style={{fontSize:12,color:"#7A6A5C"}}>คำตอบ</label>
                <textarea rows="2" value={f.answer||""} onChange={e=>{
                  const next = {...paySettings, faqs: paySettings.faqs.map((x,xi)=> xi===i ? {...x, answer:e.target.value} : x)};
                  savePaySettings(next);
                }} style={{marginBottom:8}}/>
                <button className="pill" onClick={()=>{
                  const next = {...paySettings, faqs: paySettings.faqs.filter((_,xi)=>xi!==i)};
                  savePaySettings(next);
                }}>ลบคำถามนี้</button>
              </div>
            ))}
            <button className="btn-teal" style={{width:"100%"}} onClick={()=>{
              const next = {...paySettings, faqs: [...(paySettings.faqs||[]), {keywords:[""], answer:""}]};
              savePaySettings(next);
            }}>+ เพิ่มคำถามใหม่</button>
          </div>
        )}
        {tab==="orders" && (orders.length===0 ? <p style={{textAlign:"center",color:"#9C8A7A",padding:"30px 0"}}>ยังไม่มีออเดอร์</p> :
          [...orders].reverse().map(o=>(
            <OrderCard key={o.code} o={o} setOrderStatus={setOrderStatus} setLotteryUsed={setLotteryUsed} grantMascotFood={grantMascotFood}/>
          ))
        )}
      </div>
    </div>
  );
}

function App(){
  const { profile, ready } = useLiffProfile();
  const [catalog,setCatalog] = useState([]);
  const [cart,setCart] = useState([]);
  const [cartOpen,setCartOpen] = useState(false);
  const [screen,setScreen] = useState("shop");
  const [lastOrder,setLastOrder] = useState(null);
  const [submitting,setSubmitting] = useState(false);
  const [adminOpen,setAdminOpen] = useState(false);
  const [mascotOpen,setMascotOpen] = useState(false);
  const [showMascotHint,setShowMascotHint] = useState(false);
  const [settings,setSettings] = useState(null);

  useEffect(() => {
    const loadData = () => {
      fetch(`${API_BASE}/api/catalog`, {cache:"no-store"}).then(r=>r.json()).then(setCatalog).catch(()=>{});
      fetch(`${API_BASE}/api/settings`, {cache:"no-store"}).then(r=>r.json()).then(setSettings).catch(()=>{});
    };
    loadData();
    const interval = setInterval(loadData, 15000); // รีเฟรชเมนู/ราคาอัตโนมัติทุก 15 วินาที
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    if (!ready || !profile?.userId) return;
    const showT = setTimeout(() => setShowMascotHint(true), 900);
    const hideT = setTimeout(() => setShowMascotHint(false), 900 + 4000);
    return () => { clearTimeout(showT); clearTimeout(hideT); };
  }, [ready, profile?.userId]);

  const addToCart = useCallback((product,variant,qty) => {
    setCart(prev => {
      const key = `${product.id}-${variant.id}`;
      const existing = prev.find(it=>it.key===key);
      if (existing) return prev.map(it=>it.key===key?{...it,qty:it.qty+qty}:it);
      return [...prev,{key,productId:product.id,productName:product.name,variantLabel:variant.label,price:variant.price,qty}];
    });
  }, []);
  const changeQty = (key,n) => setCart(prev => n<=0 ? prev.filter(it=>it.key!==key) : prev.map(it=>it.key===key?{...it,qty:n}:it));
  const removeItem = (key) => setCart(prev=>prev.filter(it=>it.key!==key));
  const total = cart.reduce((s,it)=>s+it.price*it.qty,0);
  const itemCount = cart.reduce((s,it)=>s+it.qty,0);

  const confirmOrder = async (info) => {
    setSubmitting(true);
    try {
      const res = await fetch(`${API_BASE}/api/order`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          userId: profile?.userId || "guest-" + Date.now(),
          lineDisplayName: profile?.displayName,
          items: cart, total, ...info,
        }),
      });
      const data = await res.json();
      setLastOrder({ code: data.code, ...info, items: cart, total });
      setCart([]);
      setScreen("confirm");
    } catch (e) {
      alert("ส่งออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setSubmitting(false);
    }
  };

  if (!ready || catalog.length===0) {
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>กำลังโหลดร้าน...</div>;
  }

  return (
    <div style={{minHeight:"100vh"}}>
      <div className="header">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <p style={{margin:0,fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"var(--mustard)"}}>สั่งผ่าน LINE OA</p>
            <h1 className="mitr" style={{margin:"2px 0 0",fontSize:24}}>ขนมครกสิงคโปร์</h1>
            <p style={{margin:"4px 0 0",fontSize:12,opacity:.85}}>สดใหม่ทุกออเดอร์ · เลือกเมนูแล้วยืนยันได้เลย</p>
          </div>
          <div style={{display:"flex",gap:8}}>
            {profile?.userId && (
              <div style={{position:"relative"}}>
                <button onClick={()=>{setMascotOpen(true);setShowMascotHint(false);}} style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,.15)",color:"#fff",fontSize:17}}>🐣</button>
                {showMascotHint && (
                  <div style={{
                    position:"absolute", top:44, left:"50%", transform:"translateX(-50%)", zIndex:20,
                    background:"var(--plum)", color:"#fff", fontSize:12, fontWeight:600,
                    padding:"8px 12px", borderRadius:12, whiteSpace:"nowrap",
                    boxShadow:"0 8px 16px -8px rgba(0,0,0,.5)",
                    animation:"hint-pop .3s cubic-bezier(.34,1.56,.64,1)",
                  }}>
                    🐣 เลี้ยงมาสคอตของคุณได้ที่นี่!
                    <div style={{position:"absolute", top:-6, left:"50%", width:12, height:12, background:"var(--plum)", transform:"translateX(-50%) rotate(45deg)"}}/>
                  </div>
                )}
              </div>
            )}
            <button onClick={()=>setAdminOpen(true)} style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,.15)",color:"#fff"}}>⚙</button>
          </div>
        </div>
        <style>{`
          @keyframes hint-pop { 0%{ opacity:0; transform: translateY(-6px) scale(.9);} 100%{ opacity:1; transform: translateY(0) scale(1);} }
        `}</style>
      </div>

      {screen==="shop" && (
        <div style={{padding:"12px 16px 110px"}}>
          {catalog.map(p=><ProductCard key={p.id} product={p} onAdd={addToCart}/>)}
        </div>
      )}
      {screen==="checkout" && (
        <CheckoutScreen cart={cart} total={total} profile={profile} submitting={submitting}
          onBack={()=>setScreen("shop")} onConfirm={confirmOrder}/>
      )}
      {screen==="confirm" && lastOrder && (
        <ConfirmScreen order={lastOrder} settings={settings} onNewOrder={()=>{setLastOrder(null);setScreen("shop");}} onPlayLottery={()=>setScreen("lottery")}/>
      )}
      {screen==="lottery" && lastOrder && (
        <LotteryScreen orderCode={lastOrder.code} onDone={()=>{setLastOrder(null);setScreen("shop");}}/>
      )}

      {screen==="shop" && itemCount>0 && (
        <div className="sticky-bottom">
          <button className="btn-primary" style={{width:"100%",display:"flex",justifyContent:"space-between"}} onClick={()=>setCartOpen(true)}>
            <span>🛍 {itemCount} รายการ</span>
            <span className="mono">{baht(total)}฿</span>
          </button>
        </div>
      )}

      <CartDrawer open={cartOpen} onClose={()=>setCartOpen(false)} cart={cart}
        onQtyChange={changeQty} onRemove={removeItem} total={total}
        onCheckout={()=>{setCartOpen(false);setScreen("checkout");}}/>

      {mascotOpen && profile?.userId && <MascotScreen userId={profile.userId} onClose={()=>setMascotOpen(false)}/>}

      {adminOpen && <AdminPanel onClose={()=>{
        setAdminOpen(false);
        fetch(`${API_BASE}/api/catalog`, {cache:"no-store"}).then(r=>r.json()).then(setCatalog).catch(()=>{});
        fetch(`${API_BASE}/api/settings`, {cache:"no-store"}).then(r=>r.json()).then(setSettings).catch(()=>{});
      }}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

  const __src = document.getElementById('app-source').textContent;
  const __out = Babel.transform(__src, { presets: [["react", { runtime: "classic" }]] }).code;
  const __s = document.createElement('script');
  __s.textContent = __out;
  document.body.appendChild(__s);
</script>
</body>
</html>
