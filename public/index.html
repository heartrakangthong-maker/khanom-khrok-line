<title>ขนมครกสิงคโปร์ — สั่งผ่าน LINE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  :root{
    --teal:#146B6E; --coral:#E85D4C; --mustard:#E3A335;
    --cream:#FBF3E7; --cream-deep:#F3E6D3; --plum:#3A2233; --leaf:#527A54;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);font-family:'Sarabun',sans-serif;color:var(--plum);}
  .mitr{font-family:'Mitr',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,textarea{font-family:inherit;}
  .card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 20px -12px rgba(58,34,51,.25);}
  .pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid #D9C9AE;background:#fff;color:var(--plum);}
  .pill.active{background:var(--coral);border-color:var(--coral);color:#fff;}
  .btn-primary{background:var(--coral);color:#fff;border-radius:999px;padding:12px 20px;font-weight:600;}
  .btn-primary:disabled{opacity:.4;}
  .btn-teal{background:var(--teal);color:#fff;border-radius:999px;padding:10px 16px;font-weight:600;}
  .stepper{display:flex;align-items:center;border:1px solid #D9C9AE;border-radius:999px;overflow:hidden;}
  .stepper button{width:32px;height:32px;color:var(--teal);}
  .header{background:var(--teal);padding:20px 16px 26px;color:#fff;}
  .thumb{width:64px;height:64px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,#E3A33533,#E85D4C22);border:2px dashed var(--cream-deep);object-fit:cover;}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;}
  .drawer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;max-height:85vh;display:flex;flex-direction:column;z-index:31;}
  input[type=text],input[type=password],input[type=number],textarea{width:100%;padding:8px 12px;border-radius:12px;border:1px solid #D9C9AE;font-size:14px;}
  .sticky-bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 16px 20px;background:linear-gradient(to top, var(--cream), var(--cream) 60%, transparent);}
</style>
</head>

function useLiffProfile(){
  const [profile, setProfile] = useState(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    if (!window.liff || LIFF_ID === "YOUR_LIFF_ID") { setReady(true); return; }
    liff.init({ liffId: LIFF_ID }).then(async () => {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const p = await liff.getProfile();
      setProfile(p);
      setReady(true);
    }).catch(() => setReady(true));
  }, []);
  return { profile, ready };
}

function Pill({active,onClick,children}){

}
function Stepper({value,onChange,min=0}){
  return (
    <div className="stepper">
      <button onClick={()=>onChange(Math.max(min,value-1))}>−</button>
      <span className="mono" style={{width:28,textAlign:"center",fontWeight:600}}>{value}</span>
      <button onClick={()=>onChange(value+1)}>+</button>
    </div>
  );
}

  return <div className="thumb">{product.emoji || "🍽️"}</div>;
}

/* ====== เสียงน่ารักๆ สำหรับตอนอาบน้ำ ====== */
function useCuteSound(){
  const ctxRef = React.useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === "suspended") ctxRef.current.resume();
    return ctxRef.current;
  };
  const playCute = () => {
    try {
      const ctx = getCtx();
      const notes = [660, 880, 990, 1320];
      notes.forEach((freq, i) => {
        const t0 = ctx.currentTime + i * 0.09;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.22, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + 0.25);
      });
      const t1 = ctx.currentTime + 0.4;
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(500, t1);
      osc2.frequency.exponentialRampToValueAtTime(180, t1 + 0.18);
      gain2.gain.setValueAtTime(0.18, t1);
      gain2.gain.exponentialRampToValueAtTime(0.001, t1 + 0.2);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start(t1); osc2.stop(t1 + 0.22);
    } catch (e) { /* เบราว์เซอร์บางตัวอาจเล่นเสียงไม่ได้ ข้ามไปเงียบๆ */ }
  };
  const playPat = () => {
    try {
      const ctx = getCtx();
      const notes = [740, 990];
      notes.forEach((freq, i) => {
        const t0 = ctx.currentTime + i * 0.1;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.18, t0 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + 0.18);
      });
    } catch (e) { /* เบราว์เซอร์บางตัวอาจเล่นเสียงไม่ได้ ข้ามไปเงียบๆ */ }
  };
  return { playCute, playPat };
}

/* ====== Pop-up อาบน้ำมาสคอต — โชว์ภาพอาบน้ำจริงของแต่ละร่าง พร้อมเสียงน่ารักๆ ====== */
function BathPopup({stage,caption,onClose}){
  const { playCute } = useCuteSound();
  useEffect(() => { playCute(); }, []);
  const lines = [
    "ฟองสบู่หอมๆ อาบน้ำสะอาดสดชื่น~ 🛁",
    "แชะๆ น้ำอุ่นสบายตัวจัง! 🦆",
    "สะอาดหมดจด พร้อมลุยวันใหม่ 🌿",
    "ฟองฟู่ๆ เย็นฉ่ำ ชื่นใจสุดๆ ✨",
  ];
  const [text] = useState(caption || lines[Math.floor(Math.random()*lines.length)]);
  // ถ้าไม่ระบุ stage มา (เช่นตอนแอดมินกดปุ่มทดสอบ) สุ่มโชว์ร่างใดร่างหนึ่งให้ดูตัวอย่างได้ทุกแบบ
  const stageKeys = Object.keys(BATH_IMAGES);
  const [pickedStage] = useState(stage && BATH_IMAGES[stage] ? stage : stageKeys[Math.floor(Math.random()*stageKeys.length)]);
  const image = BATH_IMAGES[pickedStage];
  return (
    <div className="drawer-overlay" style={{display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}} onClick={onClose}>
      <div className="card" style={{width:280,textAlign:"center",position:"relative"}} onClick={e=>e.stopPropagation()}>
        <button onClick={onClose} aria-label="ปิด" style={{position:"absolute",top:10,right:12,fontSize:18,color:"#9C8A7A"}}>✕</button>
        <div style={{position:"relative",width:"100%",aspectRatio:"1/1",borderRadius:16,overflow:"hidden",background:"linear-gradient(180deg,#FFF9EC,#F3E9D3)"}}>
          <img src={image} alt="มาสคอตกำลังอาบน้ำ" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
        </div>
        <p className="mitr" style={{fontWeight:700,fontSize:15,margin:"14px 0 4px"}}>{text}</p>
        <p style={{fontSize:12,color:"#9C8A7A",margin:0}}>แตะพื้นหลังหรือปุ่ม ✕ เพื่อปิดหน้าต่างนี้</p>
      </div>
    </div>
  );
}

      await fetch(`${API_BASE}/api/mascot/${userId}/name`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: nameInput.trim().slice(0,20)}),
      });
      setEditingName(false);
      load();
    } finally {
      setSavingName(false);
    }
  };

  const giveSnack = async () => {
    if (snacking || !data?.canSnack) return;
    setSnacking(true);
    try {
      await fetch(`${API_BASE}/api/mascot/${userId}/snack`, { method:"POST" });
      setFlash("fed");
      setTimeout(()=>setFlash(null), 500);
      load();
    } finally {
      setSnacking(false);
    }
  };

  const giveSpecialFood = async () => {
    if (specialFeeding || !data?.canFeed) return;
    setSpecialFeeding(true);
    try {
      await fetch(`${API_BASE}/api/mascot/${userId}/feed`, { method:"POST" });
      setFlash("fed");
      setTimeout(()=>setFlash(null), 500);
      load();
    } finally {
      setSpecialFeeding(false);
    }
  };

  const shareMascot = () => {
    const text = `น้อง${data?.customName ? `"${data.customName}"` : ""}ของฉันตอนนี้เป็น ${data?.stageName} แล้ว! มาเลี้ยงมาสคอตด้วยกันได้ที่ขนมครกสิงคโปร์ OK นะ 🌿`;
    try {
      if (window.liff && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
        liff.shareTargetPicker([{ type:"text", text }]);
      } else if (window.liff && liff.isLoggedIn && liff.isLoggedIn()) {
        // เผื่อ LINE เวอร์ชันเก่าไม่รองรับ shareTargetPicker
        alert("อุปกรณ์นี้ยังแชร์ผ่านปุ่มไม่ได้ ลองคัดลอกข้อความไปแชร์เองก่อนนะครับ:\n\n" + text);
      }
    } catch (e) { /* เงียบไว้ ไม่ให้แอปพัง */ }
  };

  const formatCooldown = (ms) => {
    const totalMin = Math.max(1, Math.ceil(ms / 60000));
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    if (h <= 0) return `อีก ${m} นาที`;
    return `อีก ${h} ชม. ${m} นาที`;
  };

  const MOOD_BADGE = { happy:"😊", hungry:"🍽️", dirty:"🫧", sad:"😢" };

  const redeem = async () => {
    if (redeeming || !data?.canRedeem) return;
    setRedeeming(true);
    try {
      await fetch(`${API_BASE}/api/mascot/${userId}/redeem`, { method:"POST" });
      load();
    } finally {
      setRedeeming(false);
    }
  };

  // กดปุ่มอาบน้ำ -> เด้ง Pop-up ก่อน (พร้อมเสียง) ส่วนการบันทึกจริงจะทำตอนปิด Pop-up
  const openBathPopup = () => {
    if (bathing || !data?.isDirty) return;
    setShowBathPopup(true);
  };

  const finishBath = async () => {
    setShowBathPopup(false);
    setBathing(true);
    try {
      await fetch(`${API_BASE}/api/mascot/${userId}/bath`, { method:"POST" });
    } finally {
      load();
      setBathing(false);
    }
  };

  const patMascot = () => {
    if (patting) return;
    setPatting(true);
    playPat();
    setTimeout(()=>setPatting(false), 900);
  };

  const spawnFood = () => {
    if (!data?.canFeed || foodPos) return;
    setFoodPos({...BOX});
    setShowDragHint(true);
    setTimeout(()=>setShowDragHint(false), 2500);
  };

  const getRelPos = (e) => {
    const rect = stageRef.current.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };

  const onFoodPointerDown = (e) => {
    e.preventDefault();
    setDragging(true);
    setShowDragHint(false);
  };

  useEffect(() => {
    if (!dragging) return;
    const move = (e) => {
      const pos = getRelPos(e);
      setFoodPos(pos);
      const dist = Math.hypot(pos.x-MOUTH.x, pos.y-MOUTH.y);
      setMouthOpen(dist < CATCH_R);
    };
    const up = async (e) => {
      setDragging(false);
      const pos = foodPosRef.current;
      const dist = pos ? Math.hypot(pos.x-MOUTH.x, pos.y-MOUTH.y) : 999;
      if (dist < CATCH_R) {
        setMouthOpen(false);
        setFoodPos(null);
        setFlash("fed");
        await fetch(`${API_BASE}/api/mascot/${userId}/feed`, { method:"POST" });
        setTimeout(()=>{ setFlash(null); load(); }, 500);
      } else {
        setMouthOpen(false);
        setFoodPos({...BOX});
      }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    return () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
  }, [dragging]);

  if (!data) return null;
  const progress = data.nextThreshold
    ? Math.min(100, ((data.foodGiven-data.stageStart)/(data.nextThreshold-data.stageStart))*100)
    : 100;

  return (
    <div className="card" style={{marginBottom:12,textAlign:"center",background:"linear-gradient(180deg,#FFFDF6,var(--cream-deep))",border:"1px solid #F0E2C4",borderRadius:26,padding:"20px 16px",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",top:-30,left:-30,width:110,height:110,borderRadius:"50%",background:"radial-gradient(circle,#E3A33533,transparent 70%)"}}/>
      <div style={{position:"absolute",bottom:-40,right:-30,width:140,height:140,borderRadius:"50%",background:"radial-gradient(circle,#527A5433,transparent 70%)"}}/>
      {data.seasonalEvent && data.seasonalEvent.active && data.seasonalEvent.label && (
        <div style={{display:"inline-flex",alignItems:"center",gap:5,background:"var(--coral)",color:"#fff",borderRadius:999,padding:"4px 12px",margin:"0 0 8px",fontSize:11.5,fontWeight:700,position:"relative"}}>
          <span>{data.seasonalEvent.emoji || "🎉"}</span><span>{data.seasonalEvent.label}</span>
        </div>
      )}
      {!editingName ? (
        <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"#fff",border:"1px solid #F0E2C4",borderRadius:999,padding:"5px 14px",margin:"0 0 12px",position:"relative",boxShadow:"0 3px 8px -4px rgba(58,34,51,.2)"}}>
          <span style={{fontSize:14}}>🌿</span>
          <p className="mitr" style={{margin:0,fontSize:14,fontWeight:700,color:"var(--plum)"}}>
            {data.stageName}{data.customName ? ` "${data.customName}"` : ""}{data.isDirty && !bathing ? " · เลอะจัง 🫧" : ""}
          </p>
          <button onClick={startEditName} aria-label="แก้ไขชื่อ" style={{fontSize:12,color:"#9C8A7A",padding:0}}>✏️</button>
        </div>
      ) : (
        <div style={{display:"flex",alignItems:"center",gap:6,background:"#fff",border:"1px solid #F0E2C4",borderRadius:999,padding:"5px 6px 5px 14px",margin:"0 0 12px",position:"relative",boxShadow:"0 3px 8px -4px rgba(58,34,51,.2)",maxWidth:260,marginLeft:"auto",marginRight:"auto"}}>
          <input type="text" value={nameInput} onChange={e=>setNameInput(e.target.value)} maxLength={20} placeholder="ตั้งชื่อน้อง" style={{border:"none",padding:"4px 0",fontSize:13,flex:1,minWidth:0}} onKeyDown={e=>e.key==="Enter"&&saveName()}/>
          <button onClick={saveName} disabled={savingName} style={{fontSize:12,fontWeight:700,color:"var(--teal)",padding:"4px 8px"}}>บันทึก</button>
          <button onClick={()=>setEditingName(false)} style={{fontSize:14,color:"#9C8A7A",padding:"4px 4px"}}>✕</button>
        </div>
      )}
      <div ref={stageRef} style={{position:"relative",width:200,height:225,margin:"0 auto",touchAction: dragging ? "none" : "auto"}}>
        <div style={{
          position:"absolute", top:8, left:12, width:176, height:176, borderRadius:"50%",
          background:"radial-gradient(circle at 40% 35%, #ffffff 0%, var(--cream-deep) 70%, transparent 100%)",
          boxShadow:"inset 0 0 0 2px rgba(255,255,255,.7), 0 6px 18px -8px rgba(58,34,51,.25)",
        }}/>
        {["8%,18%","82%,14%","12%,78%","86%,70%"].map((pos,i)=>{
          const [left,top] = pos.split(",");
          const emojis = ["✨","🌿","✨","🍃"];
          return (
            <div key={i} style={{
              position:"absolute", top, left, fontSize: i%2===0?13:15, opacity:.85,
              animation:`sparkle-float ${2.6+i*0.4}s ease-in-out ${i*0.3}s infinite`,
            }}>{emojis[i]}</div>
          );
        })}
        <div style={{
          position:"absolute", top:130, left:130, width:34, height:34, borderRadius:"50%",
          background:"#fff", border:"2px solid var(--cream-deep)", display:"flex",
          alignItems:"center", justifyContent:"center", fontSize:16,
          boxShadow:"0 3px 8px -2px rgba(58,34,51,.3)", zIndex:6,
        }}>
          {MOOD_BADGE[data.mood] || "😊"}
        </div>
        <div style={{position:"absolute",top:0,left:35,width:130,height:130}}>
          <div style={{
            width:"100%",height:"100%",
            animation: bathing ? "none" : "mascot-bob 2.4s ease-in-out infinite",
          }}>
            <img
              src={data.image}
              alt={data.stageName}
              style={{
                width:"100%", height:"100%", objectFit:"contain",
                transform: flash==="fed" ? "scale(1.1)" : patting ? "scale(1.06) rotate(-3deg)" : mouthOpen ? "scale(1.04)" : "scale(1)",
                transition:"transform .2s cubic-bezier(.34,1.56,.64,1)",
                filter: bathing ? "brightness(1.05)" : "none",
              }}
            />
          </div>

          {/* open-mouth illusion when food is close */}
          {mouthOpen && (
            <div style={{
              position:"absolute", top:66, left:"50%", transform:"translateX(-50%)",
              width:22, height:14, borderRadius:"50% 50% 60% 60%",
              background:"rgba(58,34,51,.75)",
              animation:"mouth-pop .18s ease-out",
            }}/>
          )}

          {/* dirt smudges */}
          {data.isDirty && !bathing && (
            <React.Fragment>
              <div style={{position:"absolute",top:"32%",left:"22%",width:16,height:12,borderRadius:"50%",background:"rgba(140,110,72,.55)",transform:"rotate(-15deg)"}}/>
              <div style={{position:"absolute",top:"55%",left:"66%",width:20,height:14,borderRadius:"50%",background:"rgba(140,110,72,.5)",transform:"rotate(10deg)"}}/>
              <div style={{position:"absolute",top:"68%",left:"38%",width:14,height:10,borderRadius:"50%",background:"rgba(140,110,72,.5)"}}/>
            </React.Fragment>
          )}

          {/* pat hearts */}
          {patting && (
            <div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
              {[...Array(4)].map((_,i)=>(
                <div key={i} style={{
                  position:"absolute", top:"20%", left:`${30+i*15}%`, fontSize:16,
                  animation:`heart-rise .9s ease-out ${i*0.1}s forwards`, opacity:0,
                }}>💚</div>
              ))}
            </div>
          )}

          {/* patting hand */}
          {patting && (
            <div style={{
              position:"absolute", top:-14, left:"50%",
              fontSize:30, transformOrigin:"70% 0%",
              animation:"hand-pat .9s ease-in-out",
            }}>🤚</div>
          )}
        </div>

        {/* food box */}
        <div
          onClick={spawnFood}
          style={{
            position:"absolute", top:168, left:"50%", transform:"translateX(-50%)",
            width:44, height:36, borderRadius:8,
            background: data.canFeed ? "var(--mustard)" : "#D9C9AE",
            border:"2px solid var(--plum)", display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:18, cursor: data.canFeed && !foodPos ? "pointer" : "default",
            boxShadow:"0 3px 6px rgba(0,0,0,.2)",
            animation: data.canFeed && !foodPos ? "box-nudge 1.6s ease-in-out infinite" : "none",
          }}
        >
          🎁
          {data.foodInventory>0 && (
            <span className="mono" style={{position:"absolute",bottom:-8,right:-8,background:"var(--coral)",color:"#fff",fontSize:10,fontWeight:700,borderRadius:999,padding:"1px 6px"}}>{data.foodInventory}</span>
          )}
        </div>
        <p style={{position:"absolute", top:206, left:"50%", transform:"translateX(-50%)", fontSize:10, color:"#9C8A7A", whiteSpace:"nowrap", margin:0}}>
          👆 กล่องอาหาร
        </p>

        {/* drag-teaching popup */}
        {showDragHint && foodPos && (
          <div style={{
            position:"absolute", top:BOX.y-52, left:"50%", transform:"translateX(-50%)",
            background:"var(--plum)", color:"#fff", fontSize:11, fontWeight:600,
            padding:"6px 10px", borderRadius:10, whiteSpace:"nowrap", zIndex:15,
            animation:"hint-fade 2.5s ease-in-out forwards",
          }}>
            ลากอาหารไปป้อนน้องได้เลย! 👆
            <div style={{position:"absolute", bottom:-5, left:"50%", width:10, height:10, background:"var(--plum)", transform:"translateX(-50%) rotate(45deg)"}}/>
          </div>
        )}

        {/* draggable food token */}
        {foodPos && (
          <div
            onPointerDown={onFoodPointerDown}
            style={{
              position:"absolute", top:foodPos.y-16, left:foodPos.x-16,
              width:32, height:32, borderRadius:"50%",
              background:"#fff", border:"2px solid var(--plum)",
              display:"flex",alignItems:"center",justifyContent:"center", fontSize:18,
              cursor:"grab", touchAction:"none", zIndex:10,
              boxShadow: dragging ? "0 6px 10px rgba(0,0,0,.3)" : "0 2px 4px rgba(0,0,0,.2)",
              transition: dragging ? "none" : "top .25s ease, left .25s ease",
            }}
          >🍡</div>
        )}
      </div>

      <button className="pill" style={{width:"auto",padding:"6px 18px",borderRadius:999,margin:"2px 0 8px",fontSize:13}} disabled={patting} onClick={patMascot}>
        🤚 ลูบหัวมาสคอต
      </button>

      <p style={{fontSize:12,color:"#7A6A5C",margin:"0 0 10px"}}>
        {data.nextThreshold ? `ให้อาหารแล้ว ${data.foodGiven}/${data.nextThreshold} ชิ้น เพื่อโตขึ้นอีกขั้น!` : "โตเต็มขั้นแล้ว ขอบคุณที่อุดหนุนกันมาตลอดนะครับ 🙏"}
      </p>
      <div style={{height:10,background:"#fff",border:"1px solid #F0E2C4",borderRadius:999,overflow:"hidden",margin:"0 0 16px",boxShadow:"inset 0 1px 3px rgba(58,34,51,.12)"}}>
        <div style={{height:"100%",width:`${progress}%`,background:"linear-gradient(90deg,#8FBE63,var(--leaf))",borderRadius:999,transition:"width .4s"}}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        <div style={{background:"#fff",border:"1px solid #F0E2C4",borderRadius:14,padding:"10px 8px",textAlign:"center",boxShadow:"0 3px 8px -6px rgba(58,34,51,.2)"}}>
          <div style={{fontSize:17,lineHeight:1}}>💎</div>
          <p style={{fontSize:10,color:"#7A6A5C",margin:"3px 0 0"}}>แต้มของคุณ</p>
          <p className="mono" style={{fontSize:16,fontWeight:800,color:"var(--coral)",margin:"1px 0 0"}}>{data.availablePoints}</p>
        </div>
        <div style={{background:"#fff",border:"1px solid #F0E2C4",borderRadius:14,padding:"10px 8px",textAlign:"center",boxShadow:"0 3px 8px -6px rgba(58,34,51,.2)"}}>
          <div style={{fontSize:17,lineHeight:1}}>🎁</div>
          <p style={{fontSize:10,color:"#7A6A5C",margin:"3px 0 0"}}>อาหารพิเศษ</p>
          <p className="mono" style={{fontSize:16,fontWeight:800,color:"var(--leaf)",margin:"1px 0 0"}}>{data.foodInventory}</p>
        </div>
      </div>
      <p style={{fontSize:11,color:"#9C8A7A",margin:"0 0 12px"}}>
        {data.canFeed ? "แตะกล่องของขวัญ 🎁 แล้วลากอาหารไปป้อนน้องได้เลย หรือกดปุ่ม \"ป้อนอาหารพิเศษ\" ด้านล่าง" : `ทุกออเดอร์ที่เสร็จแล้วได้ 1 แต้ม · ใช้ ${data.pointsPerFood} แต้มแลกอาหารพิเศษได้ 1 ชิ้น`}
      </p>

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {data.nextThreshold && (
          <button className="btn-teal" style={{background: data.canRedeem ? "var(--teal)" : "#C9BBA5",borderRadius:999}} disabled={redeeming || !data.canRedeem} onClick={redeem}>
            💰 แลกแต้มเป็นอาหารพิเศษ (ใช้ {data.pointsPerFood} แต้ม)
          </button>
        )}
        <button className="pill" style={{width:"100%",borderRadius:999,background: data.canSnack ? "#fff" : "#F2EEE2",borderColor: data.canSnack ? "var(--leaf)" : "#DCD2BA",color: data.canSnack ? "#3E6B2C" : "#A69A85"}} disabled={snacking || !data.canSnack} onClick={giveSnack}>
          {data.canSnack ? "🍙 ให้อาหารว่าง (ฟรี)" : `🍙 ให้อาหารว่าง · ${formatCooldown(data.snackCooldownMs)}`}
        </button>
        {data.isDirty && (
          <button className="btn-teal" style={{background: flash==="clean" ? "var(--leaf)" : "#3D7FBF",borderRadius:999,boxShadow:"0 4px 10px -4px rgba(61,127,191,.6)"}} disabled={bathing} onClick={openBathPopup}>
            {bathing ? "กำลังอาบน้ำ... 🫧" : flash==="clean" ? "สะอาดแล้ว! ✨" : "🛁 อาบน้ำให้มาสคอต"}
          </button>
        )}
        {data.nextThreshold && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <button className="pill" style={{borderRadius:999,fontSize:12.5,padding:"10px 6px",background: data.canFeed ? "linear-gradient(180deg,#F0B84A,#E3A335)" : "#E4DCC8",color: data.canFeed ? "#fff" : "#9C8A7A",border:"none"}} disabled={specialFeeding || !data.canFeed} onClick={giveSpecialFood}>
              🎁 {data.canFeed ? "ป้อนอาหารพิเศษ" : "ไม่มีในคลัง"}
            </button>
            <button className="pill" style={{borderRadius:999,fontSize:12.5,padding:"10px 6px",borderColor:"#06C755",color:"#06C755"}} onClick={shareMascot}>
              📤 แชร์เพื่อน
            </button>
          </div>
        )}
        <button className="pill" style={{width:"100%",borderRadius:999}} onClick={()=>setShowShopPopup(true)}>
          🛍 ร้านค้า
        </button>
      </div>

      {showBathPopup && <BathPopup stage={data.stage} onClose={finishBath}/>}
      {showShopPopup && (
        <div className="drawer-overlay" style={{display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}} onClick={()=>setShowShopPopup(false)}>
          <div className="card" style={{width:260,textAlign:"center",position:"relative"}} onClick={e=>e.stopPropagation()}>
            <button onClick={()=>setShowShopPopup(false)} aria-label="ปิด" style={{position:"absolute",top:10,right:12,fontSize:18,color:"#9C8A7A"}}>✕</button>
            <div style={{fontSize:38,margin:"6px 0 4px"}}>👒✨</div>
            <p className="mitr" style={{fontWeight:700,fontSize:15,margin:"0 0 6px"}}>ร้านค้ากำลังจะมาเร็วๆ นี้!</p>
            <p style={{fontSize:12,color:"#9C8A7A",margin:0}}>เร็วๆ นี้จะใช้แต้มแลกเครื่องแต่งกายให้มาสคอตได้ที่นี่ รอติดตามนะครับ 🎉</p>
          </div>
        </div>
      )}

      <style>{`
        @keyframes sparkle-float { 0%,100%{ transform: translateY(0) rotate(0deg); opacity:.85;} 50%{ transform: translateY(-7px) rotate(12deg); opacity:1;} }
        @keyframes mascot-bob { 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-6px) rotate(-2deg);} }
        @keyframes heart-rise { 0%{ transform: translateY(0) scale(.5); opacity:0;} 20%{ opacity:1;} 100%{ transform: translateY(-46px) scale(1.1); opacity:0;} }
        @keyframes mouth-pop { 0%{ transform: translateX(-50%) scale(.5); opacity:0;} 100%{ transform: translateX(-50%) scale(1); opacity:1;} }
        @keyframes box-nudge { 0%,100%{ transform: translateX(-50%) rotate(0deg);} 50%{ transform: translateX(-50%) rotate(-6deg);} }
        @keyframes hint-fade { 0%{ opacity:0; transform: translateX(-50%) translateY(4px);} 10%{ opacity:1; transform: translateX(-50%) translateY(0);} 85%{ opacity:1;} 100%{ opacity:0;} }
        @keyframes hand-pat {
          0%,100% { transform: translateX(-50%) translateY(0) rotate(-15deg); opacity:0; }
          8% { opacity:1; }
          25% { transform: translateX(-50%) translateY(16px) rotate(-15deg); }
          40% { transform: translateX(-50%) translateY(0) rotate(-15deg); }
          55% { transform: translateX(-50%) translateY(16px) rotate(-15deg); }
          70% { transform: translateX(-50%) translateY(0) rotate(-15deg); }
          92% { opacity:1; }
        }
      `}</style>
    </div>
  );
}

function MascotScreen({userId,onClose}){
  return (
    <div style={{position:"fixed",inset:0,background:"#fff",zIndex:35,display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:"1px solid #F3E6D3"}}>
        <h2 className="mitr" style={{margin:0,fontSize:16}}>มาสคอตของฉัน</h2>
        <button onClick={onClose}>✕</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>
        <MascotCard userId={userId}/>
      </div>
    </div>
  );
}

function ProductCard({product,onAdd}){
  const [variantId,setVariantId] = useState(product.variants[0]?.id);
  const [qty,setQty] = useState(1);
  const [flash,setFlash] = useState(false);
  const variant = product.variants.find(v=>v.id===variantId) || product.variants[0];
  const soldOut = !!product.soldOut;
  const add = () => {
    if (soldOut) return;
    onAdd(product, variant, qty);
    setQty(1); setFlash(true); setTimeout(()=>setFlash(false),500);
  };
  return (
    <div className="card" style={{marginBottom:12, opacity: soldOut ? 0.6 : 1}}>

function useGachaSound(){
  const ctxRef = React.useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === "suspended") ctxRef.current.resume();
    return ctxRef.current;
  };
  const beep = (freq,duration,type,startOffset,gainVal) => {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + startOffset;
    g.gain.setValueAtTime(gainVal, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.start(t); osc.stop(t + duration);
  };
  const playShake = () => { getCtx(); for (let i=0;i<13;i++) beep(280+Math.random()*160, 0.06, "square", i*0.2, 0.06); };
  const playDrop = () => {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = "sine";
    const t = ctx.currentTime;
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(110, t + 0.45);
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.45);
  };
  const playChime = () => { [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,0.35,"triangle",i*0.09,0.11)); };
  return { playShake, playDrop, playChime };
}

    if (phase!=="idle") return;
    const idx = Math.floor(Math.random()*WINDOW_BALLS.length);
    setWinner(idx);
    setPhase("shaking");

    fetch(`${API_BASE}/api/lottery/${orderCode}`, { method:"POST" })

        setTimeout(()=>{ setPhase("falling"); sound.playDrop(); }, 2600);

  );
}

          <button
            className="pill"
            style={o.lotteryUsed ? {} : {background:"var(--mustard)",borderColor:"var(--mustard)",color:"#fff"}}
            onClick={()=>setLotteryUsed(o.code, !o.lotteryUsed)}
          >
            {o.lotteryUsed ? "✓ ใช้แล้ว" : "ยังไม่ใช้"}
          </button>
        </div>
      )}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span className="mono" style={{fontWeight:700}}>{baht(o.total)}฿</span>
        <div style={{display:"flex",gap:6}}>
          {["ใหม่","กำลังทำ","เสร็จแล้ว"].map(s=>(
            <Pill key={s} active={o.status===s} onClick={()=>setOrderStatus(o.code,s)}>{s}</Pill>
          ))}
        </div>
      </div>
      {o.userId && (
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <input
            type="number" min="1" value={grantAmount}

            style={{width:64,textAlign:"center"}}
          />
          <button className="pill" style={{flex:1}} onClick={()=>grantMascotFood(o.userId, grantAmount)}>
            🎁 แจกอาหารมาสคอต +{grantAmount} ให้ลูกค้าคนนี้
          </button>
        </div>
      )}
    </div>
  );
}

function AdminPanel({onClose}){
  const [passcode,setPasscode] = useState("");
  const [unlocked,setUnlocked] = useState(false);
  const [catalog,setCatalog] = useState([]);
  const [orders,setOrders] = useState([]);
  const [tab,setTab] = useState("menu");
  const [error,setError] = useState("");
  const [paySettings,setPaySettings] = useState({qrImage:"",accountName:"",faqs:[],lottery:[],pointsPerFood:1,seasonalEvent:{active:false,label:"",emoji:"🎉"}});
  const [showAdminBathTest,setShowAdminBathTest] = useState(false);

  const unlock = async () => {
    const res = await fetch(`${API_BASE}/api/orders`, { headers: { "x-admin-passcode": passcode }, cache:"no-store" });
    if (!res.ok) { setError("รหัสผ่านไม่ถูกต้อง"); return; }
    setOrders(await res.json());
    const c = await fetch(`${API_BASE}/api/catalog`, {cache:"no-store"}).then(r=>r.json());
    setCatalog(c);
    const s = await fetch(`${API_BASE}/api/settings`, {cache:"no-store"}).then(r=>r.json());
    setPaySettings(s);
    setUnlocked(true);
  };

  const saveCatalog = async (next) => {
    setCatalog(next);
    try {
      const res = await fetch(`${API_BASE}/api/catalog`, {
        method:"PUT",
        headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
        body: JSON.stringify(next),
      });
      if (!res.ok) alert(`บันทึกไม่สำเร็จ (${res.status}) ลองใหม่อีกครั้ง`);
    } catch (e) {
      alert("บันทึกไม่สำเร็จ เช็คอินเทอร์เน็ตแล้วลองใหม่");
    }
  };
  const updateProduct = (pid, patch) => saveCatalog(catalog.map(p=>p.id===pid?{...p,...patch}:p));
  const updateVariant = (pid, vid, patch) => saveCatalog(catalog.map(p=> p.id!==pid ? p : {...p, variants:p.variants.map(v=>v.id===vid?{...v,...patch}:v)}));

  const notifySoldOut = async (productName) => {
    if (!window.confirm(`ส่งข้อความแจ้งลูกค้าทุกคนว่า "${productName}" หมดแล้วใช่ไหม?`)) return;
    try {
      await fetch(`${API_BASE}/api/notify-soldout`, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
        body: JSON.stringify({ productName }),
      });
      alert("ส่งข้อความแจ้งเตือนแล้วครับ");
    } catch (e) {
      alert("ส่งไม่สำเร็จ ลองใหม่อีกครั้ง");
    }
  };

  const savePaySettings = async (next) => {
    setPaySettings(next);
    await fetch(`${API_BASE}/api/settings`, {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
      body: JSON.stringify(next),
    });
  };

  const setOrderStatus = async (code, status) => {
    setOrders(orders.map(o=>o.code===code?{...o,status}:o));
    await fetch(`${API_BASE}/api/orders/${code}`, {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
      body: JSON.stringify({status}),
    });
  };

  const setLotteryUsed = async (code, used) => {
    setOrders(orders.map(o=>o.code===code?{...o,lotteryUsed:used}:o));
    await fetch(`${API_BASE}/api/orders/${code}`, {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
      body: JSON.stringify({lotteryUsed:used}),
    });
  };

  const grantMascotFood = async (userId, amount) => {
    if (!userId) return;
    await fetch(`${API_BASE}/api/mascot/${userId}/grant`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-admin-passcode":passcode },
      body: JSON.stringify({amount}),
    });
    alert(`แจกอาหารมาสคอต +${amount} ชิ้นให้ลูกค้าคนนี้แล้ว`);

        )}
      </div>
      {showAdminBathTest && <BathPopup onClose={()=>setShowAdminBathTest(false)}/>}
    </div>
  );
}

function App(){
  const { profile, ready } = useLiffProfile();
  const [catalog,setCatalog] = useState([]);
  const [cart,setCart] = useState([]);
  const [cartOpen,setCartOpen] = useState(false);
  const [screen,setScreen] = useState("shop");
  const [lastOrder,setLastOrder] = useState(null);
  const [submitting,setSubmitting] = useState(false);
  const [adminOpen,setAdminOpen] = useState(false);
  const [mascotOpen,setMascotOpen] = useState(false);
  const [showMascotHint,setShowMascotHint] = useState(false);
  const [settings,setSettings] = useState(null);

  useEffect(() => {
    const loadData = () => {
      fetch(`${API_BASE}/api/catalog`, {cache:"no-store"}).then(r=>r.json()).then(setCatalog).catch(()=>{});
      fetch(`${API_BASE}/api/settings`, {cache:"no-store"}).then(r=>r.json()).then(setSettings).catch(()=>{});
    };
    loadData();
    const interval = setInterval(loadData, 15000); // รีเฟรชเมนู/ราคาอัตโนมัติทุก 15 วินาที
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    if (!ready || !profile?.userId) return;
    const showT = setTimeout(() => setShowMascotHint(true), 900);
    const hideT = setTimeout(() => setShowMascotHint(false), 900 + 4000);
    return () => { clearTimeout(showT); clearTimeout(hideT); };
  }, [ready, profile?.userId]);

  const addToCart = useCallback((product,variant,qty) => {
    setCart(prev => {
      const key = `${product.id}-${variant.id}`;
      const existing = prev.find(it=>it.key===key);
      if (existing) return prev.map(it=>it.key===key?{...it,qty:it.qty+qty}:it);
      return [...prev,{key,productId:product.id,productName:product.name,variantLabel:variant.label,price:variant.price,qty}];
    });
  }, []);
  const changeQty = (key,n) => setCart(prev => n<=0 ? prev.filter(it=>it.key!==key) : prev.map(it=>it.key===key?{...it,qty:n}:it));
  const removeItem = (key) => setCart(prev=>prev.filter(it=>it.key!==key));
  const total = cart.reduce((s,it)=>s+it.price*it.qty,0);
  const itemCount = cart.reduce((s,it)=>s+it.qty,0);

  const confirmOrder = async (info) => {
    setSubmitting(true);
    try {
      const res = await fetch(`${API_BASE}/api/order`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          userId: profile?.userId || "guest-" + Date.now(),
          lineDisplayName: profile?.displayName,
          items: cart, total, ...info,
        }),
      });
      const data = await res.json();
      setLastOrder({ code: data.code, ...info, items: cart, total });
      setCart([]);
      setScreen("confirm");
    } catch (e) {
      alert("ส่งออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setSubmitting(false);
    }
  };

  if (!ready || catalog.length===0) {
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>กำลังโหลดร้าน...</div>;
  }

  return (
    <div style={{minHeight:"100vh"}}>
      <div className="header">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <p style={{margin:0,fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"var(--mustard)"}}>สั่งผ่าน LINE OA</p>
            <h1 className="mitr" style={{margin:"2px 0 0",fontSize:24}}>ขนมครกสิงคโปร์</h1>
            <p style={{margin:"4px 0 0",fontSize:12,opacity:.85}}>สดใหม่ทุกออเดอร์ · เลือกเมนูแล้วยืนยันได้เลย</p>
          </div>
          <div style={{display:"flex",gap:8}}>
            {profile?.userId && (
              <div style={{position:"relative"}}>
                <button onClick={()=>{setMascotOpen(true);setShowMascotHint(false);}} style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,.15)",color:"#fff",fontSize:17}}>🐣</button>
                {showMascotHint && (
                  <div style={{
                    position:"absolute", top:44, left:"50%", transform:"translateX(-50%)", zIndex:20,
                    background:"var(--plum)", color:"#fff", fontSize:12, fontWeight:600,
                    padding:"8px 12px", borderRadius:12, whiteSpace:"nowrap",
                    boxShadow:"0 8px 16px -8px rgba(0,0,0,.5)",
                    animation:"hint-pop .3s cubic-bezier(.34,1.56,.64,1)",
                  }}>
                    🐣 เลี้ยงมาสคอตของคุณได้ที่นี่!
                    <div style={{position:"absolute", top:-6, left:"50%", width:12, height:12, background:"var(--plum)", transform:"translateX(-50%) rotate(45deg)"}}/>
                  </div>
                )}
              </div>
            )}
            <button onClick={()=>setAdminOpen(true)} style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,.15)",color:"#fff"}}>⚙</button>
          </div>
        </div>
        <style>{`
          @keyframes hint-pop { 0%{ opacity:0; transform: translateY(-6px) scale(.9);} 100%{ opacity:1; transform: translateY(0) scale(1);} }
        `}</style>
      </div>

      {screen==="shop" && (
        <div style={{padding:"12px 16px 110px"}}>
          {catalog.map(p=><ProductCard key={p.id} product={p} onAdd={addToCart}/>)}
        </div>
      )}
      {screen==="checkout" && (
        <CheckoutScreen cart={cart} total={total} profile={profile} submitting={submitting}
          onBack={()=>setScreen("shop")} onConfirm={confirmOrder}/>
      )}
      {screen==="confirm" && lastOrder && (
        <ConfirmScreen order={lastOrder} settings={settings} onNewOrder={()=>{setLastOrder(null);setScreen("shop");}} onPlayLottery={()=>setScreen("lottery")}/>
      )}
      {screen==="lottery" && lastOrder && (
        <LotteryScreen orderCode={lastOrder.code} onDone={()=>{setLastOrder(null);setScreen("shop");}}/>
      )}

      {screen==="shop" && itemCount>0 && (
        <div className="sticky-bottom">
          <button className="btn-primary" style={{width:"100%",display:"flex",justifyContent:"space-between"}} onClick={()=>setCartOpen(true)}>
            <span>🛍 {itemCount} รายการ</span>
            <span className="mono">{baht(total)}฿</span>
          </button>
        </div>
      )}

      <CartDrawer open={cartOpen} onClose={()=>setCartOpen(false)} cart={cart}
        onQtyChange={changeQty} onRemove={removeItem} total={total}
        onCheckout={()=>{setCartOpen(false);setScreen("checkout");}}/>

      {mascotOpen && profile?.userId && <MascotScreen userId={profile.userId} onClose={()=>setMascotOpen(false)}/>}

      {adminOpen && <AdminPanel onClose={()=>{
        setAdminOpen(false);
        fetch(`${API_BASE}/api/catalog`, {cache:"no-store"}).then(r=>r.json()).then(setCatalog).catch(()=>{});
        fetch(`${API_BASE}/api/settings`, {cache:"no-store"}).then(r=>r.json()).then(setSettings).catch(()=>{});
      }}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

  __s.textContent = __out;
  document.body.appendChild(__s);

</body>
